<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dura Image Annotator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root{
      --left: 20rem;   /* left nav width  */
      --right: 28rem;  /* right panel width */
    }
    html, body { height:100%; }

    /* Left folders */
    .left-nav{
      position: fixed; inset: 0 auto 0 0; width: var(--left);
      overflow:auto; background:#f8fafc; border-right:1px solid #e5e7eb;
      padding: .75rem .75rem 6rem .75rem;
    }

    /* Center image well (white) */
    .center{
      position: fixed; top:0; bottom:0; left: var(--left); right: var(--right);
      background:#ffffff;
    }
    .stage { position:relative; width:100%; height:100%; }
    .stage a{ position:relative; display:block; width:100%; height:100%; }
    .stage img{
      position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
      max-width:100%; max-height:100%; object-fit:contain;
      border-radius:.25rem; background:#ffffff;
    }

    /* Overlay SVG */
    #overlay {
      position: fixed; /* positioned via JS to match the image box */
      pointer-events: none; /* toggled during draw */
      z-index: 5;
    }

    /* Right panel */
    .right{
      position: fixed; inset:0 0 0 auto; width: var(--right);
      overflow:auto; padding: 1rem .75rem 6rem .75rem; background:#fff;
      border-left:1px solid #e5e7eb;
    }

    /* Tiny thumbnail in the tree */
    .thumb{ width:56px; height:56px; object-fit:cover; border-radius:.25rem; }

    details > summary { cursor:pointer; list-style:none; }
    details > summary::-webkit-details-marker { display:none; }
    .summary-row{ display:flex; align-items:center; gap:.5rem; padding:.25rem .375rem; border-radius:.5rem; }
    .summary-row:hover{ background:#eef2ff; }

    .item-active{ background:#dbeafe; }

    /* Launch overlay -> location chooser */
    .floating-init{
      position: fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background: rgba(255,255,255,.96); z-index:50;
    }

    /* Number pill in direction rows */
    .pill{
      min-width:2rem; height:2rem; display:flex; align-items:center; justify-content:center;
      border-radius:.5rem; border:1px solid #cbd5e1; background:#f8fafc; font-weight:600;
    }

    /* Toolbars / option buttons */
    .toolbar{
      position:absolute; top:.75rem; left:.75rem; z-index:10;
      background:rgba(255,255,255,.9); backdrop-filter:saturate(1.2) blur(2px);
      border:1px solid #e5e7eb; border-radius:.5rem; padding:.25rem;
      display:flex; gap:.25rem;
    }
    .tool-btn, .opt-btn{
      padding:.35rem .6rem; border-radius:.375rem; border:1px solid #e5e7eb; background:#fff; cursor:pointer;
    }
    .tool-btn.active, .opt-btn.active{ background:#e0e7ff; border-color:#c7d2fe; }
    .tool-btn.danger{ color:#dc2626; border-color:#fecaca; background:#fff5f5; }
  </style>
</head>
<body class="text-slate-900">

  <!-- Launch overlay: select a location -->
  <div id="initScreen" class="floating-init">
    <div class="text-center space-y-3">
      <p class="text-2xl">Select a location to begin</p>
      <div class="flex items-center gap-2 justify-center">
        <select id="locationSelect" class="border rounded p-2 text-lg min-w-64"></select>
        <button onclick="startFromLocation()" class="bg-blue-600 text-white px-4 py-2 text-lg rounded hover:bg-blue-700">Start</button>
      </div>
      <div class="text-sm text-slate-500">You can change images from the left list any time.</div>
    </div>
  </div>

  <!-- LEFT: location tree -->
  <aside class="left-nav">
    <div class="mb-3">
      <div class="text-xs uppercase tracking-wide text-slate-500 mb-1">Locations</div>
      <input id="filterInput" class="w-full border rounded p-2 text-sm" placeholder="Filter by title / id / file…">
    </div>
    <div id="tree" class="space-y-2"></div>
  </aside>

  <!-- CENTER: image + overlay -->
  <main class="center">
    <div class="stage">
      <!-- Drawing toolbar -->
      <div id="drawToolbar" class="toolbar">
        <button id="toolRect" class="tool-btn active" title="Draw rectangle">Rect</button>
        <button id="toolEllipse" class="tool-btn" title="Draw ellipse">Ellipse</button>
        <button id="toolClear" class="tool-btn danger" title="Clear all shapes">Clear</button>
      </div>

      <a id="imageLink" href="#" target="_blank" rel="noopener">
        <img id="image" src="" alt="Image preview"/>
      </a>

      <!-- SVG overlay is positioned in JS -->
      <svg id="overlay" width="0" height="0"></svg>
    </div>
  </main>

  <!-- RIGHT: info + inputs -->
  <aside class="right">
    <!-- Basic information -->
    <div id="imageInfo" class="space-y-2 mb-6"></div>

    <!-- New: Image-scope question -->
    <div class="mb-6" id="scopeBlock">
      <div class="text-lg font-semibold mb-2">What does this image depict relative to this location?</div>
      <div id="scopeBtns" class="flex flex-col gap-2 mb-2">
        <div class="flex flex-wrap gap-2">
          <button class="opt-btn active" data-choice="field_current">Yes — the field of <span id="scopeLocName1"></span></button>
          <button class="opt-btn" data-choice="object_current">No — an object at <span id="scopeLocName2"></span></button>
        </div>
        <div class="flex flex-wrap gap-2">
          <button class="opt-btn" data-choice="field_other">No — the field of another location</button>
          <button class="opt-btn" data-choice="object_other">No — an object at another location</button>
        </div>
      </div>
      <div id="scopeExtra" class="space-y-2 hidden">
        <input id="scopeLocation" class="border rounded p-2 w-full" placeholder="Location">
        <input id="scopeObject"   class="border rounded p-2 w-full hidden" placeholder="Object depicted">
      </div>
    </div>

    <!-- Direction relative to location -->
    <div class="mb-6">
      <div class="text-lg font-semibold mb-2">Direction relative to location</div>
      <div id="dirList" class="space-y-2"></div>
      <div class="text-sm text-slate-500">Draw rectangles/ellipses on the image to add rows.</div>
    </div>

    <!-- Also found in (other images) -->
    <div class="mb-6">
      <div class="text-lg font-semibold mb-2">Also found in (other images)</div>
      <div id="alsoList" class="space-y-2"></div>
      <button class="mt-2 text-blue-600" onclick="addAlsoRow()">+ Add pair</button>
    </div>

    <!-- Comments -->
    <div class="mb-6">
      <label class="block text-lg font-semibold mb-2">Comments</label>
      <textarea id="comments" class="w-full border rounded p-2" rows="3"></textarea>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="submitReview()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Submit</button>
      <button id="loadLastBtn" onclick="loadLast()" class="bg-yellow-500 text-white px-3 py-2 rounded hover:bg-yellow-600">Load My Last Submission</button>
      <div class="ml-auto flex items-center gap-2">
        <button onclick="prevImage()" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">&larr; Prev</button>
        <button onclick="nextImage()" class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">Next &rarr;</button>
      </div>
    </div>
  </aside>

  <script>
    const SHEET_PROXY = '/api/sheet';
    const DATA_FILE   = 'field_url_0801.json';

    const CARDINALS = ['N','NE','E','SE','S','SW','W','NW'];
    const RELATIONS = ['to','of','from','inside']; // extend if needed

    let groups = {};            // { locationKey: [img, ...] }
    let orderedKeys = [];       // location keys for sidebar and dropdown
    let allFlat = [];           // flat array for search
    let currentGroup = null;    // string key (e.g., "h4")
    let currentIndex = 0;       // index within currentGroup

    // Drawing state
    let currentTool = 'rect';   // 'rect' | 'ellipse'
    let isDrawing = false;
    let startPx = null;         // {x, y} in overlay pixels
    let tempShape = null;       // {svgEl, labelEl}
    let shapes = [];            // [{id, type, geom(norm), svgEl, labelEl, rowEl, label}, ...]

    // Image-scope selection
    let scopeChoice = 'field_current'; // default
    const qs  = sel => document.querySelector(sel);
    const qsa = sel => Array.from(document.querySelectorAll(sel));

    function imgAt(gk, i){
      if(!gk || !groups[gk]) return null;
      return groups[gk][i] || null;
    }

    function flattenAll(){
      allFlat = [];
      for(const key of orderedKeys){
        (groups[key]||[]).forEach((it, i)=>{
          it._group = key; it._idx = i;
          allFlat.push(it);
        });
      }
    }

    // ---------------- LEFT TREE ----------------
    function renderTree(filter=''){
      const tree = qs('#tree');
      tree.innerHTML = '';
      const filterLC = filter.trim().toLowerCase();

      orderedKeys.forEach(key=>{
        const items = groups[key] || [];
        const filtered = items.filter(it=>{
          if(!filterLC) return true;
          return (it.object_id||'').toLowerCase().includes(filterLC) ||
                 (it.fname_commons||'').toLowerCase().includes(filterLC) ||
                 (it.fname_scrape||'').toLowerCase().includes(filterLC);
        });
        if(filterLC && filtered.length===0) return;

        const det = document.createElement('details');
        det.open = key===currentGroup || !!filterLC;

        const sum = document.createElement('summary');
        sum.className = 'summary-row hover:bg-indigo-50';
        sum.innerHTML = `<span class="font-semibold">${key}</span><span class="text-slate-500 text-sm">(${filtered.length}/${items.length})</span>`;
        det.appendChild(sum);

        const ul = document.createElement('ul');
        ul.className = 'mt-1 space-y-1';

        filtered.forEach(it=>{
          const realIndex = items.indexOf(it);
          const li = document.createElement('li');
          li.className = 'rounded hover:bg-indigo-50';
          li.innerHTML = `
            <button class="w-full text-left p-1.5 flex items-center gap-2 ${ (key===currentGroup && realIndex===currentIndex) ? 'item-active' : ''}">
              <img class="thumb border" src="${it.url}" alt="thumb">
              <div class="min-w-0">
                <div class="text-sm font-medium truncate">${it.fname_scrape || '(untitled)'}</div>
                <div class="text-xs text-slate-500 truncate">${it.fname_commons || ''}</div>
              </div>
            </button>`;
          li.querySelector('button').onclick = ()=>{
            currentGroup = key;
            currentIndex = realIndex;
            renderCenterAndRight();
            renderTree(qs('#filterInput').value);
          };
          ul.appendChild(li);
        });

        det.appendChild(ul);
        tree.appendChild(det);
      });
    }

    // ---------------- RIGHT: BASIC INFO ----------------
    function renderInfo(meta){
      const info = qs('#imageInfo');
      info.innerHTML = '';
      const row = (label, value, link) => {
        const p = document.createElement('p');
        p.className = 'text-base';
        p.innerHTML = `<span class="font-semibold">${label}: </span>${
          link ? `<a class="underline" target="_blank" rel="noopener" href="${link}">${value||''}</a>` : `<span>${value||''}</span>`
        }`;
        info.appendChild(p);
      };
      row('Object id', meta.object_id || '');
      row('Title', meta.fname_scrape || '');
      row('Wikimedia Commons file', meta.fname_commons || '', meta.page_url || '#');
      row('Location', meta._group || '');
      if (meta.depict_l1 || meta.depict_l2){
        const p = document.createElement('p');
        p.className = 'text-sm text-slate-600';
        p.innerHTML = `<span class="font-semibold">Depicts (data):</span> ${meta.depict_l1||''}${meta.depict_l2? ' / '+meta.depict_l2 : ''}`;
        info.appendChild(p);
      }

      // update location names in scope buttons
      qs('#scopeLocName1').textContent = meta._group || 'this location';
      qs('#scopeLocName2').textContent = meta._group || 'this location';
    }

    // ---------------- IMAGE SCOPE (question & inputs) ----------------
    function setScope(choice, prefill=null){
      scopeChoice = choice;

      qsa('#scopeBtns .opt-btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.choice === choice);
      });

      const extra = qs('#scopeExtra');
      const loc  = qs('#scopeLocation');
      const obj  = qs('#scopeObject');

      extra.classList.add('hidden');
      obj.classList.add('hidden');

      if (choice === 'field_current'){
        loc.value = '';
        obj.value = '';
      } else if (choice === 'object_current'){
        extra.classList.remove('hidden');
        obj.classList.remove('hidden');
        loc.value = (prefill && prefill.location) || currentGroup || '';
        if (prefill && prefill.object) obj.value = prefill.object;
      } else if (choice === 'field_other'){
        extra.classList.remove('hidden');
        loc.value = (prefill && prefill.location) || '';
        obj.value = '';
      } else if (choice === 'object_other'){
        extra.classList.remove('hidden');
        obj.classList.remove('hidden');
        loc.value = (prefill && prefill.location) || '';
        if (prefill && prefill.object) obj.value = prefill.object;
      }
    }

    function collectScope(){
      const loc = qs('#scopeLocation').value.trim();
      const obj = qs('#scopeObject').value.trim();
      const normalizedLoc = (scopeChoice === 'object_current' && !loc) ? (currentGroup || '') : loc;
      return { choice: scopeChoice, location: normalizedLoc, object: obj };
    }

    // ---------------- RIGHT: DIRECTION ROWS <-> SHAPES ----------------
    function renumberAll(){
      shapes.forEach((s, i)=>{
        s.label = i+1;
        if (s.rowEl) s.rowEl.querySelector('.dir-label').textContent = s.label;
        if (s.labelEl) s.labelEl.textContent = s.label;
      });
    }

    function removeShape(id){
      const idx = shapes.findIndex(s => s.id === id);
      if (idx === -1) return;
      const s = shapes[idx];
      s.svgEl?.remove();
      s.labelEl?.remove();
      s.rowEl?.remove();
      shapes.splice(idx, 1);
      renumberAll();
    }

    function makeRowForShape(shape, prefill=null){
      const host = qs('#dirList');
      const wrap = document.createElement('div');
      shape.rowEl = wrap;

      wrap.className = 'flex items-center gap-2';
      wrap.dataset.shapeId = shape.id;

      const labelPill = document.createElement('div');
      labelPill.className = 'pill dir-label';
      labelPill.textContent = shape.label;

      const selCard = document.createElement('select');
      selCard.className = 'border rounded p-1';
      CARDINALS.forEach(c=>{
        const opt = document.createElement('option'); opt.value=c; opt.textContent=c;
        selCard.appendChild(opt);
      });

      const selRel = document.createElement('select');
      selRel.className = 'border rounded p-1';
      RELATIONS.forEach(r=>{
        const opt = document.createElement('option'); opt.value=r; opt.textContent=r;
        selRel.appendChild(opt);
      });

      const locInput = document.createElement('input');
      locInput.className = 'border rounded p-1 flex-1';
      locInput.placeholder = 'location';

      const del = document.createElement('button');
      del.className = 'text-sm border rounded px-2 py-1 text-red-600 border-red-400';
      del.textContent = 'Del';
      del.onclick = ()=> removeShape(shape.id);

      if(prefill){
        if(prefill.cardinal) selCard.value = prefill.cardinal;
        if(prefill.relation) selRel.value = prefill.relation;
        if(prefill.location) locInput.value = prefill.location;
      }

      wrap.appendChild(labelPill);
      wrap.appendChild(selCard);
      wrap.appendChild(selRel);
      wrap.appendChild(locInput);
      wrap.appendChild(del);
      host.appendChild(wrap);
    }

    function collectRelativeFromRows(){
      return shapes.map(s=>{
        const wrap = s.rowEl;
        if(!wrap) return null;
        const [selCard, selRel, inp] = wrap.querySelectorAll('select, input');
        return { label: s.label, cardinal: selCard.value, relation: selRel.value, location: inp.value.trim() };
      }).filter(Boolean);
    }

    // ---------------- DRAWING LAYER ----------------
    function overlayRect(){ return qs('#overlay').getBoundingClientRect(); }
    function imgRect(){ return qs('#image').getBoundingClientRect(); }

    function redrawShapesFromNorm(){
      const r = overlayRect();
      shapes.forEach(s=>{
        if (s.type === 'rect'){
          s.svgEl?.setAttribute('x', s.geom.x * r.width);
          s.svgEl?.setAttribute('y', s.geom.y * r.height);
          s.svgEl?.setAttribute('width',  s.geom.w * r.width);
          s.svgEl?.setAttribute('height', s.geom.h * r.height);
          if(s.labelEl){
            s.labelEl.setAttribute('x', s.geom.x*r.width + s.geom.w*r.width/2);
            s.labelEl.setAttribute('y', s.geom.y*r.height + s.geom.h*r.height/2);
          }
        } else {
          s.svgEl?.setAttribute('cx', s.geom.cx * r.width);
          s.svgEl?.setAttribute('cy', s.geom.cy * r.height);
          s.svgEl?.setAttribute('rx', s.geom.rx * r.width);
          s.svgEl?.setAttribute('ry', s.geom.ry * r.height);
          if(s.labelEl){
            s.labelEl.setAttribute('x', s.geom.cx * r.width);
            s.labelEl.setAttribute('y', s.geom.cy * r.height);
          }
        }
      });
    }

    function placeOverlayToImage(){
      const img = qs('#image');
      const r = img.getBoundingClientRect();
      const svg = qs('#overlay');
      svg.style.left   = r.left + 'px';
      svg.style.top    = r.top + 'px';
      svg.style.width  = r.width + 'px';
      svg.style.height = r.height + 'px';
      svg.setAttribute('width',  r.width);
      svg.setAttribute('height', r.height);
      svg.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
      redrawShapesFromNorm();
    }

    function startDraw(e){
      const imgR = imgRect();
      if (e.clientX < imgR.left || e.clientX > imgR.right || e.clientY < imgR.top || e.clientY > imgR.bottom) return;

      isDrawing = true;
      qs('#overlay').style.pointerEvents = 'auto';

      startPx = { x: e.clientX, y: e.clientY };
      const ov = qs('#overlay');

      if (currentTool === 'rect'){
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', 0); rect.setAttribute('y', 0);
        rect.setAttribute('width', 0); rect.setAttribute('height', 0);
        rect.setAttribute('fill', 'none');
        rect.setAttribute('stroke', 'red');
        rect.setAttribute('stroke-width', '2');
        tempShape = { svgEl: rect, labelEl: null, type:'rect' };
        ov.appendChild(rect);
      } else {
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        el.setAttribute('cx', 0); el.setAttribute('cy', 0);
        el.setAttribute('rx', 0); el.setAttribute('ry', 0);
        el.setAttribute('fill', 'none');
        el.setAttribute('stroke', 'red');
        el.setAttribute('stroke-width', '2');
        tempShape = { svgEl: el, labelEl: null, type:'ellipse' };
        ov.appendChild(el);
      }
    }

    function moveDraw(e){
      if(!isDrawing || !tempShape) return;
      const r = overlayRect();
      const x1 = Math.max(r.left, Math.min(e.clientX, r.right));
      const y1 = Math.max(r.top,  Math.min(e.clientY, r.bottom));
      const sx = Math.max(r.left, Math.min(startPx.x, r.right));
      const sy = Math.max(r.top,  Math.min(startPx.y, r.bottom));

      const x0 = Math.min(sx, x1) - r.left;
      const y0 = Math.min(sy, y1) - r.top;
      const w  = Math.abs(x1 - sx);
      const h  = Math.abs(y1 - sy);

      if(tempShape.type === 'rect'){
        tempShape.svgEl.setAttribute('x', x0);
        tempShape.svgEl.setAttribute('y', y0);
        tempShape.svgEl.setAttribute('width', w);
        tempShape.svgEl.setAttribute('height', h);
      }else{
        const cx = x0 + w/2, cy = y0 + h/2;
        tempShape.svgEl.setAttribute('cx', cx);
        tempShape.svgEl.setAttribute('cy', cy);
        tempShape.svgEl.setAttribute('rx', w/2);
        tempShape.svgEl.setAttribute('ry', h/2);
      }
    }

    function endDraw(e){
      if(!isDrawing || !tempShape) return;
      isDrawing = false;
      qs('#overlay').style.pointerEvents = 'none';

      // compute normalized geometry
      const r = overlayRect();
      let geom;
      if(tempShape.type === 'rect'){
        const x = parseFloat(tempShape.svgEl.getAttribute('x'));
        const y = parseFloat(tempShape.svgEl.getAttribute('y'));
        const w = parseFloat(tempShape.svgEl.getAttribute('width'));
        const h = parseFloat(tempShape.svgEl.getAttribute('height'));
        if(w < 3 || h < 3){ tempShape.svgEl.remove(); tempShape=null; return; }
        geom = { x: x/r.width, y: y/r.height, w: w/r.width, h: h/r.height };
      } else {
        const cx = parseFloat(tempShape.svgEl.getAttribute('cx'));
        const cy = parseFloat(tempShape.svgEl.getAttribute('cy'));
        const rx = parseFloat(tempShape.svgEl.getAttribute('rx'));
        const ry = parseFloat(tempShape.svgEl.getAttribute('ry'));
        if(rx < 2 || ry < 2){ tempShape.svgEl.remove(); tempShape=null; return; }
        geom = { cx: cx/r.width, cy: cy/r.height, rx: rx/r.width, ry: ry/r.height };
      }

      // label (bigger + white halo)
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('text-anchor','middle');
      label.setAttribute('dominant-baseline','middle');
      label.setAttribute('fill','red');
      label.setAttribute('font-size','40');
      label.setAttribute('paint-order','stroke');
      label.setAttribute('stroke','white');
      label.setAttribute('stroke-width','3');

      if(tempShape.type === 'rect'){
        const x = parseFloat(tempShape.svgEl.getAttribute('x'));
        const y = parseFloat(tempShape.svgEl.getAttribute('y'));
        const w = parseFloat(tempShape.svgEl.getAttribute('width'));
        const h = parseFloat(tempShape.svgEl.getAttribute('height'));
        label.setAttribute('x', x + w/2);
        label.setAttribute('y', y + h/2);
      } else {
        const cx = parseFloat(tempShape.svgEl.getAttribute('cx'));
        const cy = parseFloat(tempShape.svgEl.getAttribute('cy'));
        label.setAttribute('x', cx);
        label.setAttribute('y', cy);
      }
      qs('#overlay').appendChild(label);

      const id = 'shape_' + Math.random().toString(36).slice(2,9);
      const shape = { id, type: tempShape.type, geom, svgEl: tempShape.svgEl, labelEl: label, rowEl: null, label: 0 };
      shapes.push(shape);
      renumberAll();
      label.textContent = shape.label;

      makeRowForShape(shape);

      label.style.cursor = 'pointer';
      label.title = 'Click to delete this annotation';
      label.addEventListener('click', ()=> removeShape(shape.id));

      tempShape = null;
    }

    // ---------------- ALSO-FOUND UI ----------------
    function addAlsoRow(prefill=null){
      const host = qs('#alsoList');
      const wrap = document.createElement('div');
      wrap.className = 'flex items-center gap-2';

      const labelNum = document.createElement('input');
      labelNum.className = 'border rounded p-1 w-28';
      labelNum.placeholder = 'label num';

      const ofText = document.createElement('span');
      ofText.textContent = 'of';

      const imgId = document.createElement('input');
      imgId.className = 'border rounded p-1 flex-1';
      imgId.placeholder = 'Image id / filename';

      const del = document.createElement('button');
      del.className = 'text-sm border rounded px-2 py-1 text-red-600 border-red-400';
      del.textContent = 'Del';
      del.onclick = ()=> wrap.remove();

      if(prefill){
        if(prefill.label) labelNum.value = prefill.label;
        if(prefill.image) imgId.value = prefill.image;
      }

      wrap.appendChild(labelNum);
      wrap.appendChild(ofText);
      wrap.appendChild(imgId);
      wrap.appendChild(del);
      host.appendChild(wrap);
    }

    function collectAlso(){
      return qsa('#alsoList > div').map(wrap=>{
        const inputs = wrap.querySelectorAll('input');
        return { label: inputs[0].value.trim(), image: inputs[1].value.trim() };
      }).filter(x => x.label || x.image);
    }

    // ---------------- RENDER/RESET PER IMAGE ----------------
    async function renderCenterAndRight(){
      const meta = imgAt(currentGroup, currentIndex);
      if(!meta){ return; }

      // Reset the loaded image tracking when changing to a new image
      _lastLoadedImage = null;

      qs('#image').src = meta.url || '';
      qs('#imageLink').href = meta.page_url || '';

      shapes.forEach(s=>{ s.svgEl?.remove(); s.labelEl?.remove(); });
      shapes = [];
      qs('#dirList').innerHTML = '';
      qs('#alsoList').innerHTML = '';
      qs('#comments').value = '';

      renderInfo(meta);
      qs('#image').onload = ()=>{
        placeOverlayToImage();
        setScope('field_current');   // default selection
        loadLast();                  // may override scope and restore shapes
      };
    }

    // ---------------- NAV ----------------
    function startFromLocation(){
      const sel = qs('#locationSelect');
      if(!sel.value) return;
      currentGroup = sel.value;
      currentIndex = 0;
      qs('#initScreen').style.display = 'none';
      renderCenterAndRight();
      renderTree(qs('#filterInput').value);
    }

    async function nextImage(){
      if(!currentGroup) return;
      const arr = groups[currentGroup] || [];
      if(currentIndex < arr.length-1){
        currentIndex++;
      } else {
        const gi = orderedKeys.indexOf(currentGroup);
        if(gi >=0 && gi < orderedKeys.length-1){
          currentGroup = orderedKeys[gi+1];
          currentIndex = 0;
        }
      }
      await renderCenterAndRight();
      renderTree(qs('#filterInput').value);
    }

    async function prevImage(){
      if(!currentGroup) return;
      if(currentIndex > 0){
        currentIndex--;
      } else {
        const gi = orderedKeys.indexOf(currentGroup);
        if(gi > 0){
          currentGroup = orderedKeys[gi-1];
          currentIndex = (groups[currentGroup]||[]).length - 1;
        }
      }
      await renderCenterAndRight();
      renderTree(qs('#filterInput').value);
    }

    // ---------------- SHEET HELPERS ----------------
    async function loadLastSubmission(imageName){
      try{
        const res = await fetch(`${SHEET_PROXY}?image=${encodeURIComponent(imageName)}`);
        if(!res.ok) return null;
        return await res.json();
      }catch(e){
        console.warn('Could not fetch saved review:', e);
        return null;
      }
    }

    // Track the last loaded image to prevent duplicate loading
    let _lastLoadedImage = null;

    async function loadLast(){
      const meta = imgAt(currentGroup, currentIndex);
      if(!meta) return;

      // Prevent duplicate loading for the same image
      const currentImageKey = `${currentGroup}-${currentIndex}-${meta.fname_commons}`;
      if (_lastLoadedImage === currentImageKey) return;
      _lastLoadedImage = currentImageKey;

      const saved = await loadLastSubmission(meta.fname_commons);
      if(!saved) return;

      // Restore shapes if areas exist
      const ov = qs('#overlay');
      if (Array.isArray(saved.areas) && saved.areas.length){
        saved.areas
          .sort((a,b)=> (a.label||0)-(b.label||0))
          .forEach(a=>{
            if(a.type === 'rect'){
              const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
              rect.setAttribute('fill','none'); rect.setAttribute('stroke','red'); rect.setAttribute('stroke-width','2');
              ov.appendChild(rect);

              const label = document.createElementNS('http://www.w3.org/2000/svg','text');
              label.setAttribute('text-anchor','middle'); label.setAttribute('dominant-baseline','middle');
              label.setAttribute('fill','red'); label.setAttribute('font-size','24');
              label.setAttribute('paint-order','stroke'); label.setAttribute('stroke','white'); label.setAttribute('stroke-width','3');
              ov.appendChild(label);

              const id = 'shape_' + Math.random().toString(36).slice(2,9);
              const s = { id, type:'rect', geom:{x:a.x,y:a.y,w:a.w,h:a.h}, svgEl:rect, labelEl:label, rowEl:null, label:0 };
              shapes.push(s);
              label.addEventListener('click', ()=> removeShape(id));
            } else if (a.type === 'ellipse'){
              const el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
              el.setAttribute('fill','none'); el.setAttribute('stroke','red'); el.setAttribute('stroke-width','2');
              ov.appendChild(el);

              const label = document.createElementNS('http://www.w3.org/2000/svg','text');
              label.setAttribute('text-anchor','middle'); label.setAttribute('dominant-baseline','middle');
              label.setAttribute('fill','red'); label.setAttribute('font-size','24');
              label.setAttribute('paint-order','stroke'); label.setAttribute('stroke','white'); label.setAttribute('stroke-width','3');
              ov.appendChild(label);

              const id = 'shape_' + Math.random().toString(36).slice(2,9);
              const s = { id, type:'ellipse', geom:{cx:a.cx,cy:a.cy,rx:a.rx,ry:a.ry}, svgEl:el, labelEl:label, rowEl:null, label:0 };
              shapes.push(s);
              label.addEventListener('click', ()=> removeShape(id));
            }
          });
        renumberAll();
        placeOverlayToImage(); // sets positions using normalized geom

        shapes.forEach(s=>{
          const pre = (saved.relative || []).find(r => (r.label|0) === s.label);
          makeRowForShape(s, pre || null);
          if(s.labelEl) s.labelEl.textContent = s.label;
        });
      } else {
        (saved.relative || []).forEach(r=>{
          const id = 'shape_' + Math.random().toString(36).slice(2,9);
          const s = { id, type:'rect', geom:{x:0,y:0,w:0,h:0}, svgEl:null, labelEl:null, rowEl:null, label:0 };
          shapes.push(s);
          makeRowForShape(s, r);
        });
        renumberAll();
      }

      // restore scope selection if present
      if (saved.image_scope){
        setScope(saved.image_scope.choice || 'field_current', saved.image_scope);
        if (saved.image_scope.location) qs('#scopeLocation').value = saved.image_scope.location;
        if (saved.image_scope.object)   qs('#scopeObject').value   = saved.image_scope.object;
      }

      // also
      qs('#alsoList').innerHTML = '';
      (saved.also || []).forEach(a => addAlsoRow(a));
      if((saved.also || []).length===0) addAlsoRow();

      qs('#comments').value = saved.comment || '';
    }

    function buildAreasPayload(){
      return shapes.map(s=>{
        const a = { label: s.label, type: s.type };
        Object.assign(a, s.geom);
        return a;
      });
    }

    function submitReview(){
      const meta = imgAt(currentGroup, currentIndex);
      if(!meta) return;

      const payload = {
        timestamp: new Date().toISOString(),
        image: meta.fname_commons || '',
        object_id: meta.object_id || '',
        title: meta.fname_scrape || '',
        location_key: meta._group || '',
        image_scope: collectScope(),            // NEW
        relative: collectRelativeFromRows(),    // aligned by label numbers
        also: collectAlso(),
        comment: qs('#comments').value || '',
        depict_l1: meta.depict_l1 || '',
        depict_l2: meta.depict_l2 || '',
        areas: buildAreasPayload()              // normalized geometry
      };

      const form = new URLSearchParams();
      for (const [k,v] of Object.entries({
        timestamp: payload.timestamp,
        image: payload.image,
        object_id: payload.object_id,
        title: payload.title,
        location_key: payload.location_key,
        image_scope: JSON.stringify(payload.image_scope),
        relative: JSON.stringify(payload.relative),
        also: JSON.stringify(payload.also),
        comment: payload.comment,
        depict_l1: payload.depict_l1,
        depict_l2: payload.depict_l2,
        areas: JSON.stringify(payload.areas)
      })) form.append(k, v);

      fetch(SHEET_PROXY, {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: form.toString()
      })
      .then(r => r.text())
      .then(()=>{
        alert('✅ Saved');
        localStorage.setItem('review_'+payload.image, JSON.stringify(payload));
      })
      .catch(()=> alert('❌ Error saving'));
    }

    // ---------------- BOOT ----------------
    // option button events
    document.getElementById('scopeBtns').addEventListener('click', (e)=>{
      const btn = e.target.closest('.opt-btn');
      if(!btn) return;
      setScope(btn.dataset.choice);
    });

    // left filter
    document.getElementById("filterInput").addEventListener("input", e=>{
      renderTree(e.target.value);
    });

    // drawing tool events
    document.getElementById('toolRect').onclick = ()=>{
      currentTool = 'rect';
      qs('#toolRect').classList.add('active');
      qs('#toolEllipse').classList.remove('active');
    };
    document.getElementById('toolEllipse').onclick = ()=>{
      currentTool = 'ellipse';
      qs('#toolEllipse').classList.add('active');
      qs('#toolRect').classList.remove('active');
    };
    document.getElementById('toolClear').onclick = ()=>{
      if(!confirm('Clear all shapes for this image?')) return;
      shapes.forEach(s=>{ s.svgEl?.remove(); s.labelEl?.remove(); s.rowEl?.remove(); });
      shapes = [];
    };

    // overlay draw listeners
    document.addEventListener('mousedown', startDraw);
    document.addEventListener('mousemove', moveDraw);
    document.addEventListener('mouseup',   endDraw);
    window.addEventListener('resize', placeOverlayToImage);

    // load data
    fetch(DATA_FILE)
      .then(r=>r.json())
      .then(data=>{
        groups = data || {};
        orderedKeys = Object.keys(groups);
        flattenAll();

        // populate dropdown
        const sel = qs('#locationSelect');
        sel.innerHTML = orderedKeys.map(k => {
          const cnt = (groups[k]||[]).length;
          return `<option value="${k}">${k} (${cnt})</option>`;
        }).join('');
        if(orderedKeys.length === 0){
          sel.innerHTML = `<option value="">(no locations found)</option>`;
        }

        renderTree(); // wait for user start
      })
      .catch(err=>{
        console.error('Failed to load data file:', err);
      });
  </script>
</body>
</html>
